name: Build DynoCue

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.osName }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            osName: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            osName: linux
          - os: windows-2025-vs2026
            arch: amd64
            osName: windows
          - os: macos-26
            arch: arm64
            osName: mac
          - os: macos-26-intel
            arch: amd64
            osName: mac
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ matrix.arch }}-go-tools-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-tools-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: gui/frontend/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Task
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Cache Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev webkit2gtk-4.1 libappindicator3-dev vlc libvlc-dev ffmpeg

      - name: Install Windows dependencies (VLC & FFmpeg)
        if: matrix.osName == 'windows'
        run: |
          choco install vlc ffmpeg -y --no-progress
          
          # Install SDK into a predictable directory structure
          nuget install VideoLAN.LibVLC.Windows -Version 3.0.18 -OutputDirectory .\vlc_sdk
          
          # Resolve the dynamic version path generated by NuGet
          $sdkPath = (Get-Item .\vlc_sdk\VideoLAN.LibVLC.Windows.*).FullName
          $includePath = Join-Path $sdkPath "build\include"
          $libPath = Join-Path $sdkPath "build\x64"
          
          # CRITICAL FIX: Pass paths cleanly WITHOUT embedded quotes
          $cflags = "-I$includePath"
          $ldflags = "-L$libPath -lvlc"
          
          # Export to GITHUB_ENV so subsequent steps automatically inherit them
          echo "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_CFLAGS=$cflags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_LDFLAGS=$ldflags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          # Add standard player execution binaries to system PATH
          echo "C:\Program Files\VideoLAN\VLC" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Data\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Install macOS dependencies (VLC & FFmpeg)
        if: matrix.osName == 'mac'
        run: |
          brew update
          # Install ffmpeg standard formula
          brew install ffmpeg
          
          # Install VLC SDK/libvlc using VideoLAN's official tap
          brew tap videolan/tap
          brew install videolan/tap/vlc-sid
          
          # Explicitly target the Homebrew installation paths for CGO
          VLC_PREFIX=$(brew --prefix vlc-sid)
          
          # Export to GITHUB_ENV for subsequent steps (like task build)
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$VLC_PREFIX/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$VLC_PREFIX/lib -lvlc" >> $GITHUB_ENV
          
          # Optional: Append to PKG_CONFIG_PATH if your build system uses pkg-config
          echo "PKG_CONFIG_PATH=$VLC_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Install Wails v3 CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Application
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.osName }}-${{ matrix.arch }}
          path: out/bin/