name: Build DynoCue

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - windows-11-arm
          - macos-26
          - macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/unsafe-io > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libvlc-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask vlc
          echo "CGO_CFLAGS=-I/Applications/VLC.app/Contents/MacOS/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L/Applications/VLC.app/Contents/MacOS/lib" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = if ($env:RUNNER_ARCH -eq 'ARM64') { 'winarm64' } else { 'win64' }
          $base = "https://download.videolan.org/pub/videolan/vlc/last/$dir"
          $file = [regex]::Match((Invoke-WebRequest "$base/").Content, "vlc-[\d.]+-$dir\.7z").Value
          curl.exe -fsSL --retry 3 "$base/$file" -o vlc.7z
          7z x vlc.7z -o"$env:RUNNER_TEMP" -y | Out-Null
          $vlc = (Get-Item "$env:RUNNER_TEMP\vlc-*").FullName

          if ($env:RUNNER_ARCH -eq 'ARM64') {
              # The runner's gcc only targets x86_64, so use llvm-mingw.
              $release = Invoke-RestMethod https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              $asset = $release.assets | Where-Object name -like '*-ucrt-aarch64.zip'
              curl.exe -fsSL --retry 3 $asset.browser_download_url -o llvm-mingw.zip
              7z x llvm-mingw.zip -o"$env:RUNNER_TEMP" -y | Out-Null
              $bin = (Get-Item "$env:RUNNER_TEMP\llvm-mingw-*\bin").FullName
              $env:PATH = "$bin;$env:PATH"
              Add-Content $env:GITHUB_PATH $bin
              Add-Content $env:GITHUB_ENV "CC=aarch64-w64-mingw32-clang"
              Add-Content $env:GITHUB_ENV "CXX=aarch64-w64-mingw32-clang++"

              # The arm64 SDK only ships an MSVC import lib, which lld can't use.
              Push-Location "$vlc\sdk\lib"
              gendef "$vlc\libvlc.dll"
              llvm-dlltool -m arm64 -d libvlc.def -D libvlc.dll -l libvlc.dll.a
              Pop-Location
          }

          Add-Content $env:GITHUB_ENV "CGO_CFLAGS=-I$vlc\sdk\include"
          Add-Content $env:GITHUB_ENV "CGO_LDFLAGS=-L$vlc\sdk\lib"

      - name: Install Task, Wails CLI and Yarn
        shell: bash
        run: |
          npm install -g yarn
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

      - name: Build
        run: task build

      - uses: actions/upload-artifact@v7
        with:
          name: dynocue-${{ runner.os }}-${{ runner.arch }}
          path: out/bin/
          if-no-files-found: error
