name: Build DynoCue

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.osName }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            osName: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            osName: linux
          - os: windows-2025-vs2026
            arch: amd64
            osName: windows
          - os: macos-26
            arch: arm64
            osName: mac
          - os: macos-26-intel
            arch: amd64
            osName: mac
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ matrix.arch }}-go-tools-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-tools-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: gui/frontend/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Task
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Cache Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev webkit2gtk-4.1 libappindicator3-dev vlc libvlc-dev ffmpeg

      - name: Install Windows dependencies (VLC & FFmpeg)
        if: matrix.osName == 'windows'
        run: |
          # 1. Install FFmpeg and VLC with SDK headers via Chocolatey
          choco install ffmpeg -y --no-progress
          choco install vlc -y --no-progress --package-parameters="/ADD_SDK=1"
          
          # 2. Add VLC to GitHub PATH
          if (Test-Path "C:\Program Files\VideoLAN\VLC") {
              Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\VideoLAN\VLC"
              Write-Output "Added VLC to GITHUB_PATH"
          } else {
              Write-Error "VLC installation directory not found."
          }
          
          # 3. Add FFmpeg to GitHub PATH (Targeting the exact extraction path from your logs)
          $ffmpegTools = "C:\ProgramData\chocolatey\lib\ffmpeg\tools"
          $ffmpegBin = Get-ChildItem -Path $ffmpegTools -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          
          if ($ffmpegBin) { 
              Add-Content -Path $env:GITHUB_PATH -Value $ffmpegBin
              Write-Output "Added FFmpeg ($ffmpegBin) to GITHUB_PATH"
          } else {
              Write-Error "FFmpeg binary directory could not be located."
          }
          
          # 4. Verify using absolute paths for this current step 
          # (Subsequent workflow steps will be able to just use 'vlc' and 'ffmpeg' normally)
          & "C:\Program Files\VideoLAN\VLC\vlc.exe" --version
          & "$ffmpegBin\ffmpeg.exe" -version
        shell: powershell

      - name: Install macOS dependencies (VLC & FFmpeg)
        if: matrix.osName == 'mac'
        run: |
          brew update
          # Install ffmpeg, vlc, and pkg-config
          brew install ffmpeg vlc pkg-config
          
          # Since VLC is installed as a Cask/App bundle, brew won't symlink it into /opt/homebrew.
          # We point pkg-config to the manifest bundled inside the VLC application layout.
          VLC_APP_PATH="/Applications/VLC.app"
          if [ ! -d "$VLC_APP_PATH" ]; then
            VLC_APP_PATH="$HOME/Applications/VLC.app"
          fi
          
          VLC_PKG_CONFIG_DIR="$VLC_APP_PATH/Contents/MacOS/lib/pkgconfig"
          
          # Fallback: if pkgconfig isn't present inside the bundle, resolve path structures directly
          if [ -d "$VLC_PKG_CONFIG_DIR" ]; then
            echo "PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR:$PKG_CONFIG_PATH" >> $GITHUB_ENV
            # Let pkg-config resolve flags cleanly
            echo "CGO_CFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --cflags libvlc)" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --libs libvlc)" >> $GITHUB_ENV
          else
            # Manual fallback assignments if the structure varies
            VLC_INCLUDE_PATH="$VLC_APP_PATH/Contents/MacOS/include"
            VLC_LIB_PATH="$VLC_APP_PATH/Contents/MacOS/lib"
            echo "CGO_CFLAGS=-I$VLC_INCLUDE_PATH" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=-L$VLC_LIB_PATH -lvlc" >> $GITHUB_ENV
          fi
          echo "DYLD_LIBRARY_PATH=$VLC_LIB_PATH:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Install Wails v3 CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Application
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.osName }}-${{ matrix.arch }}
          path: out/bin/