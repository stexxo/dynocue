name: Build DynoCue

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.osName }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            osName: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            osName: linux
          - os: windows-2025-vs2026
            arch: amd64
            osName: windows
          - os: windows-11-arm
            arch: arm64
            osName: windows
          - os: macos-26
            arch: arm64
            osName: mac
          - os: macos-26-intel
            arch: amd64
            osName: mac
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Pinned versions of Go-based CLI tools. Bumping a version invalidates the Go binaries
      # cache (see the `Cache Go Binaries` step) and triggers a fresh `go install`.
      TASK_VERSION: v3.51.1
      WAILS_VERSION: v3.0.0-alpha2.104
      # Pinned VLC version for Windows. Bumping this invalidates the Windows VLC cache
      # and forces a fresh download + extract.
      VLC_WIN_VERSION: 3.0.23
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare APT cache dir
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # actions/cache runs `tar` as the runner user during post-job save.
          # /var/cache/apt/archives contains root-owned subdirs (`partial/`, `lock`)
          # that the runner can't read, causing the cache save to fail.
          # Use a user-owned directory and tell apt to download .deb files there.
          mkdir -p "$HOME/apt-cache/archives/partial"
          sudo tee /etc/apt/apt.conf.d/99cache-dir >/dev/null <<EOF
          Dir::Cache "$HOME/apt-cache";
          Dir::Cache::archives "$HOME/apt-cache/archives";
          EOF

      - name: Cache Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        id: cache-apt
        uses: actions/cache@v5
        with:
          path: ~/apt-cache/archives
          key: ${{ runner.os }}-${{ matrix.arch }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-apt-

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Keep downloaded .debs in the user-owned cache for reuse on subsequent runs.
          sudo apt-get update
          sudo apt-get -o Dir::Cache="$HOME/apt-cache" -o Dir::Cache::archives="$HOME/apt-cache/archives" \
            install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev webkit2gtk-4.1 libappindicator3-dev vlc libvlc-dev ffmpeg
          # Ensure the runner user owns everything that ended up in the cache dir.
          sudo chown -R "$USER" "$HOME/apt-cache"

      - name: Cache Windows VLC
        if: matrix.osName == 'windows'
        id: cache-vlc-win
        uses: actions/cache@v5
        with:
          path: C:\Program Files\VideoLAN\VLC
          # Include arch in the key: amd64 uses the win64 bundle, arm64 uses the
          # native winarm64 bundle (available from VLC 3.0.22+).
          key: ${{ runner.os }}-${{ matrix.arch }}-vlc-${{ env.VLC_WIN_VERSION }}

      - name: Cache Windows Chocolatey ffmpeg
        if: matrix.osName == 'windows'
        id: cache-choco-ffmpeg
        uses: actions/cache@v5
        with:
          path: |
            C:\ProgramData\chocolatey\lib\ffmpeg
            C:\ProgramData\chocolatey\lib\ffmpeg.portable
            C:\ProgramData\chocolatey\lib\ffmpeg.commandline
          # Key on the workflow file so any change to the install step invalidates the cache.
          key: ${{ runner.os }}-choco-ffmpeg-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-choco-ffmpeg-

      - name: Install Windows dependencies (VLC & FFmpeg)
        if: matrix.osName == 'windows'
        run: |
          # 1. Install FFmpeg via Chocolatey (skipped on cache hit)
          if ("${{ steps.cache-choco-ffmpeg.outputs.cache-hit }}" -ne "true") {
              choco install ffmpeg -y --no-progress
          } else {
              Write-Output "FFmpeg restored from Chocolatey cache; skipping choco install."
          }
          
          # 2. Add FFmpeg to GitHub PATH
          $ffmpegTools = "C:\ProgramData\chocolatey\lib\ffmpeg\tools"
          $ffmpegBin = Get-ChildItem -Path $ffmpegTools -Recurse -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($ffmpegBin) { 
              Add-Content -Path $env:GITHUB_PATH -Value $ffmpegBin
          }
          
          # 3. Download + extract the VLC + SDK bundle (skipped on cache hit).
          # VLC 3.0.22+ ships a native Windows arm64 build under the `winarm64/` path;
          # amd64 still uses the long-standing `win64/` bundle.
          $vlcTargetDir = "C:\Program Files\VideoLAN\VLC"
          if ("${{ matrix.arch }}" -eq "arm64") {
              $vlcFlavor = "winarm64"
              $vlcSubdir = "winarm64"
          } else {
              $vlcFlavor = "win64"
              $vlcSubdir = "win64"
          }
          if ("${{ steps.cache-vlc-win.outputs.cache-hit }}" -eq "true" -and (Test-Path "$vlcTargetDir\vlc.exe")) {
              Write-Output "VLC ${{ env.VLC_WIN_VERSION }} ($vlcFlavor) restored from cache at $vlcTargetDir"
          } else {
              Write-Output "Downloading VLC ${{ env.VLC_WIN_VERSION }} ($vlcFlavor) with SDK..."
              $vlcZip = "$env:TEMP\vlc-${{ env.VLC_WIN_VERSION }}-$vlcFlavor.7z"
              $downloadUrl = "https://download.videolan.org/pub/videolan/vlc/${{ env.VLC_WIN_VERSION }}/$vlcSubdir/vlc-${{ env.VLC_WIN_VERSION }}-$vlcFlavor.7z"
          
              curl.exe -sSL $downloadUrl -o $vlcZip
          
              $baseDir = "C:\Program Files\VideoLAN"
              if (!(Test-Path $baseDir)) { mkdir $baseDir -Force | Out-Null }
          
              7z.exe x $vlcZip -o"$baseDir" -y | Out-Null
              Remove-Item $vlcZip -Force
          
              # The archive extracts to `vlc-<version>` for both flavors.
              $extractedDir = "$baseDir\vlc-${{ env.VLC_WIN_VERSION }}"
              if (Test-Path $extractedDir) {
                  if (Test-Path $vlcTargetDir) { Remove-Item $vlcTargetDir -Recurse -Force }
                  Rename-Item -Path $extractedDir -NewName "VLC"
              }
          }
          
          # 4. Add VLC to GitHub PATH
          if (Test-Path "$vlcTargetDir\vlc.exe") {
              Add-Content -Path $env:GITHUB_PATH -Value $vlcTargetDir
          }
          
          # 5. Expose VLC SDK paths to CGO using Space-Free 8.3 Short Paths
          # "C:\Program Files" -> "C:\PROGRA~1"
          $shortVlcPath = "C:\PROGRA~1\VideoLAN\VLC"
          $vlcSdkInclude = "$shortVlcPath\sdk\include"
          $vlcSdkLib = "$shortVlcPath\sdk\lib"
          
          if (Test-Path "C:\Program Files\VideoLAN\VLC\sdk\include") {
              Add-Content -Path $env:GITHUB_ENV -Value "CGO_CFLAGS=-I$vlcSdkInclude"
              Add-Content -Path $env:GITHUB_ENV -Value "CGO_LDFLAGS=-L$vlcSdkLib"
              Write-Output "Successfully configured CGO using space-free short paths: $vlcSdkInclude"
          } else {
              Write-Error "VLC SDK include directory was not found."
          }
        shell: powershell

      - name: Cache Homebrew downloads
        if: matrix.osName == 'mac'
        uses: actions/cache@v5
        with:
          # Homebrew stores bottle downloads here; caching these skips the network on re-runs.
          # We don't cache the Cellar itself — it's fragile and brew handles symlinks lazily.
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-${{ matrix.arch }}-brew-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-brew-

      - name: Install macOS dependencies (VLC & FFmpeg)
        if: matrix.osName == 'mac'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          # Silence the "untrusted tap" warnings/skips emitted by recent Homebrew versions
          # for preinstalled third-party taps on the GitHub macOS runner images
          # (aws/tap, azure/bicep, hashicorp/tap). We don't use any of them.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          # Drop preinstalled third-party taps we don't use so `brew update` / `brew install`
          # don't spend time on them or print "skipping ... not trusted" warnings.
          for tap in aws/tap azure/bicep hashicorp/tap; do
            if brew tap | grep -qx "$tap"; then
              brew untap "$tap" || true
            fi
          done

          brew update
          # Install ffmpeg, vlc, and pkg-config
          brew install ffmpeg vlc pkg-config
          
          # Since VLC is installed as a Cask/App bundle, brew won't symlink it into /opt/homebrew.
          # We point pkg-config to the manifest bundled inside the VLC application layout.
          VLC_APP_PATH="/Applications/VLC.app"
          if [ ! -d "$VLC_APP_PATH" ]; then
            VLC_APP_PATH="$HOME/Applications/VLC.app"
          fi
          
          VLC_PKG_CONFIG_DIR="$VLC_APP_PATH/Contents/MacOS/lib/pkgconfig"
          
          # Fallback: if pkgconfig isn't present inside the bundle, resolve path structures directly
          if [ -d "$VLC_PKG_CONFIG_DIR" ]; then
            echo "PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR:$PKG_CONFIG_PATH" >> $GITHUB_ENV
            # Let pkg-config resolve flags cleanly
            echo "CGO_CFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --cflags libvlc)" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --libs libvlc)" >> $GITHUB_ENV
          else
            # Manual fallback assignments if the structure varies
            VLC_INCLUDE_PATH="$VLC_APP_PATH/Contents/MacOS/include"
            VLC_LIB_PATH="$VLC_APP_PATH/Contents/MacOS/lib"
            echo "CGO_CFLAGS=-I$VLC_INCLUDE_PATH" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=-L$VLC_LIB_PATH -lvlc" >> $GITHUB_ENV
          fi
          echo "DYLD_LIBRARY_PATH=$VLC_LIB_PATH:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Binaries
        id: cache-go-bin
        uses: actions/cache@v5
        with:
          # Cache both POSIX and Windows GOBIN locations so the cache works on every runner.
          # On Linux/macOS Go installs to ~/go/bin; on Windows runners it lands in %USERPROFILE%\go\bin.
          path: |
            ~/go/bin
            ~\go\bin
          # Bump the version segment (v2) whenever the list of installed tools or their pinned
          # versions changes so the cache is invalidated intentionally.
          key: ${{ runner.os }}-${{ matrix.arch }}-go-tools-v2-task-${{ env.TASK_VERSION }}-wails-${{ env.WAILS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-tools-v2-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: gui/frontend/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Cache frontend node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: gui/frontend/node_modules
          # Key on yarn.lock so any dependency change invalidates the cache.
          # OS-specific because some npm packages ship native binaries.
          key: ${{ runner.os }}-${{ matrix.arch }}-node-modules-${{ hashFiles('gui/frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-node-modules-

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: gui/frontend
        run: yarn install --frozen-lockfile

      - name: Install Task
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Install Wails v3 CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: |
          # `setup-go` adds GOPATH/bin to PATH only on first install; ensure it's present on
          # cache hits too, on every OS. `go env GOPATH` is portable across Linux/macOS/Windows.
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build Application
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.osName }}-${{ matrix.arch }}
          path: out/bin/