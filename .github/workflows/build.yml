name: Build DynoCue

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.osName }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            osName: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            osName: linux
          - os: windows-2025-vs2026
            arch: amd64
            osName: windows
          - os: macos-26
            arch: arm64
            osName: mac
          - os: macos-26-intel
            arch: amd64
            osName: mac
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ matrix.arch }}-go-tools-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-tools-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: gui/frontend/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Task
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Cache Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev webkit2gtk-4.1 libappindicator3-dev vlc libvlc-dev ffmpeg

      - name: Install Windows dependencies (VLC & FFmpeg)
        if: matrix.osName == 'windows'
        run: |
          choco install vlc ffmpeg -y --no-progress
          
          # Use a standard User-Agent header to prevent VideoLAN from serving a truncated/blocked file
          $url = "https://get.videolan.org/vlc/3.0.18/win64/vlc-3.0.18-win64-devel.zip"
          Invoke-WebRequest -Uri $url -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -OutFile "vlc_devel.zip"
          
          # Unpack the raw archive safely
          Expand-Archive -Path "vlc_devel.zip" -DestinationPath "vlc_sdk_raw"
          
          # Normalize the root directory structure so it's a guaranteed location
          Move-Item -Path "vlc_sdk_raw/vlc-3.0.18" -Destination "vlc_sdk"
          
          # Format absolute paths using forward slashes for the CGO compiler
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          
          # Export to GITHUB_ENV with clean UTF-8 encoding
          Out-File -FilePath $env:GITHUB_ENV -InputObject "CGO_ENABLED=1" -Encoding utf8 -Append
          Out-File -FilePath $env:GITHUB_ENV -InputObject "CGO_CFLAGS=-I$workspace/vlc_sdk/sdk/include" -Encoding utf8 -Append
          Out-File -FilePath $env:GITHUB_ENV -InputObject "CGO_LDFLAGS=-L$workspace/vlc_sdk/sdk/lib -lvlc" -Encoding utf8 -Append
          
          # Add player execution binaries to system PATH
          Out-File -FilePath $env:GITHUB_PATH -InputObject "C:\Program Files\VideoLAN\VLC" -Encoding utf8 -Append
          Out-File -FilePath $env:GITHUB_PATH -InputObject "C:\Program Data\chocolatey\bin" -Encoding utf8 -Append
        shell: powershell

      - name: Install macOS dependencies (VLC & FFmpeg)
        if: matrix.osName == 'mac'
        run: |
          brew update
          # Install ffmpeg, vlc, and pkg-config
          brew install ffmpeg vlc pkg-config
          
          # Since VLC is installed as a Cask/App bundle, brew won't symlink it into /opt/homebrew.
          # We point pkg-config to the manifest bundled inside the VLC application layout.
          VLC_APP_PATH="/Applications/VLC.app"
          if [ ! -d "$VLC_APP_PATH" ]; then
            VLC_APP_PATH="$HOME/Applications/VLC.app"
          fi
          
          VLC_PKG_CONFIG_DIR="$VLC_APP_PATH/Contents/MacOS/lib/pkgconfig"
          
          # Fallback: if pkgconfig isn't present inside the bundle, resolve path structures directly
          if [ -d "$VLC_PKG_CONFIG_DIR" ]; then
            echo "PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR:$PKG_CONFIG_PATH" >> $GITHUB_ENV
            # Let pkg-config resolve flags cleanly
            echo "CGO_CFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --cflags libvlc)" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=$(PKG_CONFIG_PATH=$VLC_PKG_CONFIG_DIR pkg-config --libs libvlc)" >> $GITHUB_ENV
          else
            # Manual fallback assignments if the structure varies
            VLC_INCLUDE_PATH="$VLC_APP_PATH/Contents/MacOS/include"
            VLC_LIB_PATH="$VLC_APP_PATH/Contents/MacOS/lib"
            echo "CGO_CFLAGS=-I$VLC_INCLUDE_PATH" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=-L$VLC_LIB_PATH -lvlc" >> $GITHUB_ENV
          fi
          echo "DYLD_LIBRARY_PATH=$VLC_LIB_PATH:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Install Wails v3 CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Application
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.osName }}-${{ matrix.arch }}
          path: out/bin/