name: Build DynoCue

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build for Linux?'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build for Windows?'
        required: true
        type: boolean
        default: true
      build_mac:
        description: 'Build for macOS?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build (${{ matrix.osName }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Targets ---
          - os: ubuntu-24.04
            arch: amd64
            osName: linux
            run_job: ${{ github.event_name == 'push' || inputs.build_linux == true }}
          - os: ubuntu-24.04-arm
            arch: arm64
            osName: linux
            run_job: ${{ github.event_name == 'push' || inputs.build_linux == true }}

          # --- Windows Targets ---
          - os: windows-2025-vs2026
            arch: amd64
            osName: windows
            run_job: ${{ github.event_name == 'push' || inputs.build_windows == true }}

          # --- macOS Targets ---
          - os: macos-26
            arch: arm64
            osName: mac
            run_job: ${{ github.event_name == 'push' || inputs.build_mac == true }}
          - os: macos-26-intel
            arch: amd64
            osName: mac
            run_job: ${{ github.event_name == 'push' || inputs.build_mac == true }}

    # Only run the matrix combinations that evaluate to true
    if: ${{ matrix.run_job == true }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go Binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-${{ matrix.arch }}-go-tools-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-tools-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: gui/frontend/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Task
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Cache Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev webkit2gtk-4.1 libappindicator3-dev vlc libvlc-dev ffmpeg

      - name: Install Windows dependencies (VLC & FFmpeg)
        if: matrix.osName == 'windows'
        run: |
          choco install vlc ffmpeg -y --no-progress
          nuget install VideoLAN.LibVLC.Windows -Version 3.0.18 -OutputDirectory .\vlc_sdk
          $sdkPath = (Get-Item .\vlc_sdk\VideoLAN.LibVLC.Windows.*).FullName
          $includePath = Join-Path $sdkPath "build\include"
          $libPath = Join-Path $sdkPath "build\x64"
          $cflags = "-I$includePath"
          $ldflags = "-L$libPath -lvlc"
          echo "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_CFLAGS=$cflags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_LDFLAGS=$ldflags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\VideoLAN\VLC" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Data\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Install macOS dependencies (VLC & FFmpeg)
        if: matrix.osName == 'mac'
        run: |
          brew update
          brew install ffmpeg vlc
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Install Wails v3 CLI
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Application
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.osName }}-${{ matrix.arch }}
          path: out/bin/